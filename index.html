<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Nuru for PSI Ethiopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — top bar with portal switch; HR = sidebar + workspace; Employee = phone frame + explainer. Brand from Nuru Canva deck. */
:root{
 --teal:#1AAF9B;      /* brand teal (Canva) — fills, buttons, bars */
 --teal-ink:#0B7F70;  /* teal for text/links on white (AA) */
 --deep:#163B42;      /* brand dark teal — sidebar, headings, cards */
 --deep-2:#22545C;
 --mint:#DFF3EF;      /* pale brand tint — chips, selected rows */
 --mint-2:#BFE6DF;
 --bg:#F3F7F6; --card:#FFFFFF; --fg:#13282C; --mute:#5B7073; --line:#DCE7E5;
 --good:#1E9E5A; --good-bg:#E3F5EA; --warn:#B86E0C; --warn-bg:#FCF0DC; --bad:#C2413A; --bad-bg:#FBE6E4; --info:#2F6FB5; --info-bg:#E5EEF9;
 --display:"Poppins",-apple-system,"Segoe UI",sans-serif;
 --body:"DM Sans",-apple-system,"Segoe UI",sans-serif;
 --r:12px; --r-sm:8px; --shadow:0 1px 2px rgba(22,59,66,.06),0 4px 16px rgba(22,59,66,.06);
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--body);margin:0}
h1,h2,h3,h4{font-family:var(--display);color:var(--deep);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:15px;font-weight:600}
.num,.tab{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a{color:var(--teal-ink)}
.muted{color:var(--mute)}.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--deep);color:#fff}
.topbar .org{display:flex;align-items:center;gap:8px;font:600 13px var(--display);background:rgba(255,255,255,.1);padding:5px 10px;border-radius:999px}
.switch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;margin-left:auto}
.switch button{border:0;background:transparent;color:#cfe;padding:7px 14px;border-radius:999px;font:600 13px var(--display)}
.switch button.on{background:var(--teal);color:#fff}
.powered{font-size:12px;color:#bfe6df;white-space:nowrap}
.powered b{color:#fff;font-weight:600}
.demo-note{background:var(--warn-bg);color:#6b4306;font-size:12.5px;padding:6px 16px;text-align:center}

/* HR shell */
.hr{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 92px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .lbl{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:12px 10px 4px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:var(--r-sm);color:var(--fg);font-weight:500}
.side button:hover{background:var(--bg)}
.side button.on{background:var(--mint);color:var(--deep);font-weight:700}
.side button .badge{margin-left:auto}
.side svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.work{padding:20px 22px 40px;min-width:0;display:grid;gap:18px;align-content:start}
@media (max-width:860px){
 .hr{grid-template-columns:1fr}
 .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 16px;position:sticky;top:52px;z-index:20}
 .side .lbl{display:none}.side button{white-space:nowrap;flex-shrink:0}
 .work{padding:16px}
}

/* generic components */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--mute);max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{display:grid;gap:4px}
.kpi .k{font-size:12.5px;color:var(--mute);font-weight:500}
.kpi .v{font:600 24px var(--display);color:var(--deep);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font:600 13.5px var(--display);background:var(--teal);color:#fff;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:var(--card);color:var(--deep);border-color:var(--line)}
.btn.dark{background:var(--deep)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--mute)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.teal{background:var(--mint);color:var(--teal-ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--teal);color:#fff;font-size:11.5px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--mint);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.warn>i{background:#E0A030}.bar.bad>i{background:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 12px var(--display);color:var(--mute);text-align:left;background:#F7FAF9;letter-spacing:.02em}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FBFA}
tr.sel{background:var(--mint)!important}
td.r,th.r{text-align:right}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:5px}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--deep)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);min-width:0;width:100%}
textarea{resize:vertical;min-height:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--deep);color:#fff}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--teal)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--mint);color:var(--deep);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.privacy svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2}
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1 1 120px;display:grid;gap:4px;padding:10px;border-top:3px solid var(--line);font-size:12.5px;color:var(--mute)}
.step.done{border-color:var(--teal);color:var(--deep)}
.step.now{border-color:var(--warn);color:var(--deep);font-weight:600}

/* drawer + modal + toast */
.scrim{position:fixed;inset:0;background:rgba(19,40,44,.45);z-index:50;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--card);width:min(560px,100%);height:100%;overflow:auto;padding:20px;display:grid;gap:16px;align-content:start;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.modal{background:var(--card);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:16px;padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.x{border:0;background:var(--bg);border-radius:8px;width:32px;height:32px;font-size:18px;line-height:1;color:var(--deep)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 18px;border-radius:12px;z-index:90;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}.modal{animation:pop .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}@keyframes pop{from{transform:scale(.97);opacity:.6}}}

/* Employee shell */
.empwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px minmax(0,1fr);gap:24px;padding:24px 16px 40px;align-items:start}
.empwrap .explain{grid-column:3;max-width:360px;display:grid;gap:12px}
.empwrap .left{grid-column:1;justify-self:end;max-width:300px;display:grid;gap:10px}
.phone{grid-column:2;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 140px);min-height:620px;background:var(--bg);border-radius:38px;border:10px solid #0F2226;box-shadow:0 20px 50px rgba(22,59,66,.25);overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone .scr{flex:1;overflow:auto;padding:0 0 16px}
.phone .tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px 10px}
.phone .tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0}
.phone .tabs button.on{color:var(--teal-ink)}
.phone .tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.apphead{background:var(--deep);color:#fff;padding:16px 18px 18px;display:grid;gap:10px}
.apphead h1,.apphead h2{color:#fff}
.sect{padding:14px 16px 0;display:grid;gap:10px}
.back{border:0;background:transparent;color:#fff;font-weight:600;padding:0;display:inline-flex;gap:6px;align-items:center}
@media (max-width:1100px){.empwrap{grid-template-columns:1fr;justify-items:center}.empwrap .explain,.empwrap .left,.phone{grid-column:1}.empwrap .left{justify-self:center;max-width:400px}.empwrap .explain{max-width:400px}}
@media (max-width:440px){.phone{border-width:0;border-radius:0;height:auto;min-height:0;max-height:none;width:100%}.empwrap{padding:0 0 30px}}
.drawer{grid-template-columns:minmax(0,1fr);overflow-x:hidden}
.drawer>*{min-width:0}
.kpi .v{font-size:clamp(18px,1.6vw,23px)}

/* v2 palette: fresh, light, brand teal from the Nuru Canva deck */
:root{--teal:#14A38F;--teal-ink:#0B7F70;--deep:#0E6E63;--ink:#12312D;--mint:#E3F5F1;--mint-2:#C3EAE2;--bg:#F6F9F8;--line:#E3ECEA;--mute:#5E7471;--amber:#F0A23B}
body{background:var(--bg);color:var(--ink)}
h1,h2,h3,h4{color:var(--ink)}
.kpi .v{color:var(--ink)}
.route.rf .n{background:var(--amber)!important}
.seg button.on{background:var(--teal)}
.topbar{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);gap:12px;padding:10px 20px}
.topbar .brand{display:flex}
.topbar .vr{width:1px;height:24px;background:var(--line)}
.topbar .org{background:transparent;color:var(--ink);padding:0;font-size:14px}
.orgav{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#E8F0FE;color:#1B4FA0;font:700 10.5px var(--display)}
.switch{background:var(--bg);border:1px solid var(--line)}
.switch button{color:var(--mute)}
.switch button.on{background:#fff;color:var(--teal-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tb-r{display:flex;align-items:center;gap:6px}
.ib{position:relative;border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--bg)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#E5533D;border:2px solid #fff}
.me{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px 6px;border-radius:10px;text-align:left}
.me:hover{background:var(--bg)}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:600 12px var(--display)}
.me .who{display:grid;line-height:1.2}.me .who small{color:var(--mute);font-size:11.5px}
@media (max-width:860px){.me .who,.topbar .vr,.topbar .org{display:none}.side{top:57px}}
.side{gap:2px}
.side-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line)}
.side-foot b{color:var(--ink)}
@media (max-width:860px){.side-foot{display:none}}
.empwrap{grid-template-columns:1fr;justify-items:center;gap:12px}
.empwrap .phone{grid-column:1}
.empcap{margin:0}
/* sign-in */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:#fff}
.lg-brand{background:linear-gradient(145deg,#0E6E63 0%,#14A38F 55%,#6CC6B4 100%);color:#fff;display:grid;align-items:center;padding:48px;position:relative;overflow:hidden}
.lg-brand::before,.lg-brand::after{content:"";position:absolute;border-radius:999px;border:46px solid rgba(255,255,255,.08);width:340px;height:540px;transform:rotate(-38deg)}
.lg-brand::before{left:-150px;top:-200px}.lg-brand::after{right:-170px;bottom:-240px}
.lg-in{position:relative;display:grid;gap:18px;max-width:440px}
.lg-in h1{color:#fff;font-size:clamp(26px,3vw,38px);font-weight:700}
.lg-in p{margin:0;color:#E6F7F3;font-size:16px;max-width:42ch}
.lg-pw{font-size:13px;color:#D3F0EA}.lg-pw b{color:#fff}
.lg-form{display:grid;align-content:center;justify-items:center;padding:40px 16px;gap:24px}
.lg-card{width:min(400px,100%);display:grid;gap:14px}
.lg-card h2{font-size:22px}.lg-card p{margin:0}
.lg-card .btn{padding:12px 14px;font-size:14px}
.lg-or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg-foot{margin:0}
@media (max-width:820px){.login{grid-template-columns:1fr}.lg-brand{padding:36px 20px}}
/* HR part A: overview, employees, messages */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:11px var(--body)}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0}
.hrow .bar{grid-column:1/-1}
.hrow+.hrow{border-top:1px dashed var(--line)}
.routes{display:grid;gap:12px}
.route{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px;border-radius:var(--r-sm);background:var(--bg)}
.route .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--display);color:#fff;background:var(--teal)}
.route.rf .n{background:var(--deep)}
.route p{margin:3px 0 0;color:var(--mute);font-size:13px}
.route .amt{font:600 16px var(--display);color:var(--deep);margin-top:6px}
.att{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.att button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:10px 12px}
.att button:hover{border-color:var(--teal);background:#F8FBFA}
.att .cnt{font:600 18px var(--display);min-width:38px;color:var(--deep)}
.att .go{margin-left:auto;color:var(--teal-ink);font-weight:600;font-size:13px;white-space:nowrap}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.camp{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:6px;background:var(--card)}
.camp .d{font:600 12px var(--display);color:var(--teal-ink);text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer}
.lnk{border:0;background:none;padding:0;font-weight:600;color:var(--deep);text-align:left}
.lnk:hover{color:var(--teal-ink);text-decoration:underline}
.mini{display:grid;gap:4px;min-width:150px}
.mini .bar{height:6px}
td.ck,th.ck{width:36px;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--teal);pointer-events:none}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.selbar{position:sticky;bottom:14px;z-index:15;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--deep);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(22,59,66,.3)}
.selbar b{margin-right:6px}
.selbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.prof{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;font:600 17px var(--display);flex-shrink:0}
.plancard{background:var(--deep);color:#fff;border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.plancard h3{color:#fff}.plancard .muted{color:#bfe6df}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tot div{background:var(--bg);border-radius:var(--r-sm);padding:8px}
.tot b{display:block;font:600 15px var(--display);color:var(--deep)}
.composer{display:grid;gap:14px}
.preview{background:var(--bg);border-radius:var(--r-sm);padding:12px;white-space:pre-wrap;font-size:13.5px}
.meter{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.meter b{color:var(--deep)}
input[type=datetime-local]{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card)}
.drawhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
/* overview v2 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-radius:18px;padding:24px 28px;color:#fff;background:linear-gradient(135deg,#0E6E63 0%,#14A38F 60%,#4CC2AE 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-120px;width:300px;height:420px;border-radius:999px;border:38px solid rgba(255,255,255,.07);transform:rotate(-38deg)}
.hero-t{display:grid;gap:8px;min-width:0;flex:1 1 380px;position:relative;z-index:1}
.hero h1{color:#fff;font-size:28px}
.hero p{margin:0;color:#E6F7F3;max-width:62ch}
.eyebrow{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#CDEFE8}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.hero-stats div{display:grid}
.hero-stats b{font:600 22px var(--display);color:#fff}
.hero-stats span{font-size:12.5px;color:#D3F0EA}
.ring{width:132px;height:132px;flex-shrink:0;position:relative;z-index:1}

function msgRecipients(){
 const E=D.employees.filter(e=>!e.leaving||MSG.aud==='sel');
 if(MSG.aud==='sel')return MSG.ids.map(empById).filter(Boolean);
 if(MSG.aud==='all')return E;
 return MSG.val?E.filter(e=>e[MSG.aud]===MSG.val):[];
}
function audLabel(n){
 const v=MSG.val;
 return({all:'All staff',dept:v,office:v+' office',plan:D.PLANS[v]?.name+' plan',sel:'Selected staff'})[MSG.aud]+' ('+n+')';
}
const chText=ch=>ch.map(c=>c==='sms'?'SMS':'Email').join(' + ');
const chList=()=>MSG.ch==='both'?['sms','email']:[MSG.ch];
function smsInfo(t){
 const uni=/[^\x00-\x7F]/.test(t),one=uni?70:160,multi=uni?67:153,n=[...t].length;
 return{n,uni,one,parts:n===0?0:n<=one?1:Math.ceil(n/multi)};
}
function meterHtml(){
 const r=msgRecipients().length,s=smsInfo(MSG.body);
 return'<span><b class="num">'+r+'</b> recipient'+(r===1?'':'s')+'</span>'+
  (MSG.ch!=='email'?'<span><b class="num">'+s.n+'</b> characters · <b class="num">'+s.parts+'</b> SMS per person ('+s.one+' per SMS'+(s.uni?' in Amharic':'')+')</span><span><b class="num">'+(s.parts*r)+'</b> SMS in total</span>':'');
}

/* Fake QR: seeded grid with three finder squares */
function qr(seed,size){
 let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;
 const r=()=>{s=(Math.imul(s,1103515245)+12345)>>>0;return s/4294967296};
 const N=25,skip=(x,y)=>(x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);let p='';
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!skip(x,y)&&r()<.5)p+='M'+x+' '+y+'h1v1h-1z';
 const F=(x,y)=>'<path fill-rule="evenodd" d="M'+x+' '+y+'h7v7h-7z M'+(x+1)+' '+(y+1)+'v5h5v-5z"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>';
 return'<svg class="qr" viewBox="-1.5 -1.5 28 28" width="'+size+'" height="'+size+'" role="img" aria-label="Member QR code"><rect x="-1.5" y="-1.5" width="28" height="28" rx="2" fill="#fff"/><g fill="#13282C"><path d="'+p+'"/>'+F(0,0)+F(N-7,0)+F(0,N-7)+'</g></svg>';
}

EMP.after.refund=()=>{
 const sc=scr();if(!sc)return;
 sc.querySelectorAll('[data-f]').forEach(i=>i.addEventListener('input',()=>{rf={...rf,[i.dataset.f]:i.value}}));
 const f=$('#rf-file');
 f?.addEventListener('change',()=>{const x=f.files[0];if(!x)return;
  if(x.size>10*1024*1024){rf={...rf,err:{...rf.err,file:'This file is over 10 MB. Choose a smaller photo.'}};rr();return}
  rf={...rf,file:x.name,thumb:null,err:{...rf.err,file:''}};
  if(!x.type.startsWith('image/')){rr();return}
  const r=new FileReader();r.onload=()=>{rf={...rf,thumb:r.result};rr()};r.onerror=()=>toast('We could not read that file. Please try again.');r.readAsDataURL(x);});
};

/* COUNSELLING */
let cs={};
const csNew=()=>({stage:'pick',mode:'video',lang:'Amharic',k:null,slot:null});
const MODES=[['video','video','Video'],['phone','phone','Phone call'],['chat','msg','Chat'],['person','users','In person']];
const LANGS=['Amharic','Afaan Oromo','Tigrinya','English'];
const MORE={k1:['Tomorrow 09:00','Fri 11:00'],k2:['Thu 15:00','Fri 09:30'],k3:['Fri 16:00','Mon 10:00']};
const crisis='<div class="crisis">'+icon('phone')+'<span>In crisis? Call <b class="tbc">[crisis line TBC]</b> now. Open day and night.</span></div>';
const mhLeft=()=>{const e=me();return planOf(e).limits.mh-e.used.mh};
ACT.csSet=el=>{cs={...cs,[el.dataset.k]:el.dataset.v};if(el.dataset.k==='lang')cs={...cs,k:null,slot:null};rr()};
ACT.csSlot=el=>{cs={...cs,k:el.dataset.c,slot:el.dataset.v};rr()};
ACT.csNext=()=>{if(!cs.slot){toast('Pick a counsellor and a time.');return}cs={...cs,stage:'confirm'};rrTop()};
ACT.csBack=()=>{if(cs.stage==='confirm'){cs={...cs,stage:'pick'};rrTop()}else EMP.back()};
ACT.csConfirm=()=>{if(mhLeft()<1){toast('You have no sessions left this year.');return}const e=me();e.used={...e.used,mh:e.used.mh+1};cs={...cs,stage:'done',ref:'NC-'+(7300+Math.floor(Math.random()*600))};rrTop()};
S.counselling=()=>{
 if(!cs.stage||cs.stage==='done'&&EMP.stack.at(-1)!=='counselling'&&false)cs=csNew();
 const k=D.counsellors.find(x=>x.id===cs.k),mode=MODES.find(m=>m[0]===cs.mode);
 const priv='<div class="privacy strong">'+icon('lock')+'<span><b>Private. PSI never sees that you used this.</b> HR only sees total numbers for all staff, never names.</span></div>';
 if(cs.stage==='done')return'<section class="sect done"><div class="done-ic">'+icon('heart')+'</div><h1>Session booked</h1><p class="muted">Reference <b class="num">'+esc(cs.ref)+'</b></p>'
  +'<div class="card">'+kv('With',esc(k.name))+kv('When',esc(cs.slot))+kv('How',mode[2])+kv('Language',esc(cs.lang))+kv('Sessions left',mhLeft()+' this year')+'</div>'
  +'<p class="muted small">'+(cs.mode==='person'?'We will SMS you the room at reception.':cs.mode==='phone'?'Your counsellor will call your phone at this time.':'We will SMS you a private link 10 minutes before.')+' The SMS says "Nuru appointment" only.</p>'
  +priv+crisis+'<button class="btn" data-act="csReset">Done</button></section>';
 if(cs.stage==='confirm')return head('Confirm your session','',true,'csBack')+'<section class="sect">'
  +'<div class="card">'+kv('With',esc(k.name)+', '+esc(k.role))+kv('When',esc(cs.slot))+kv('How',mode[2])+kv('Language',esc(cs.lang))+'</div>'
  +'<div class="paybox"><span>Sessions left this year</span><b class="num">'+mhLeft()+'</b><span class="muted small">This session is free and uses 1 of them.</span></div>'
  +priv+'<button class="btn big" data-act="csConfirm"'+(mhLeft()<1?' disabled':'')+'>'+icon('check')+'Book session</button></section>';
 const ks=D.counsellors.filter(x=>x.langs.includes(cs.lang));
 return head('Talk to a counsellor','Free, private sessions with licensed counsellors')+'<section class="sect">'+priv
 +'<h3>How do you want to talk?</h3><div class="modes">'+MODES.map(m=>'<button class="mode'+(cs.mode===m[0]?' on':'')+'" data-act="csSet" data-k="mode" data-v="'+m[0]+'">'+icon(m[1])+'<span>'+m[2]+'</span></button>').join('')+'</div>'
 +'<h3>Language</h3><div class="chips">'+LANGS.map(l=>'<button class="chip'+(cs.lang===l?' on':'')+'" data-act="csSet" data-k="lang" data-v="'+l+'">'+l+'</button>').join('')+'</div>'
 +'<h3>Choose a counsellor and time</h3>'+(ks.length?ks.map(x=>'<div class="card kc'+(cs.k===x.id?' on':'')+'"><div class="kc-h"><span class="av">'+esc(x.name.replace('Dr. ','').split(' ').map(w=>w[0]).join(''))+'</span><span><b>'+esc(x.name)+'</b><span class="muted small">'+esc(x.role)+' · '+x.langs.map(esc).join(', ')+'</span></span></div><span class="small next">Next free: <b>'+esc(x.next)+'</b></span><div class="slots">'+[x.next].concat(MORE[x.id]||[]).map(s=>'<button class="slot'+(cs.k===x.id&&cs.slot===s?' on':'')+'" data-act="csSlot" data-c="'+x.id+'" data-v="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div></div>').join(''):'<p class="empty">No counsellor speaks '+esc(cs.lang)+' this week. Choose another language or call us.</p>')
 +'<p class="muted small">'+mhLeft()+' of '+planOf(me()).limits.mh+' sessions left this year.</p>'
 +'<button class="btn big" data-act="csNext"'+(cs.slot?'':' disabled')+'>Continue</button>'+crisis+'</section>';
};
ACT.csReset=()=>{cs=csNew();EMP.tab('home')};
const _go=ACT.empgo;ACT.empgo=el=>{if(el.dataset.s==='counselling'&&cs.stage==='done')cs=csNew();_go(el)};

/* CAMPAIGNS */
S.campaigns=()=>head('Health campaigns','Free check-ups at your office')+'<section class="sect">'
 +D.campaigns.filter(c=>c.status!=='Done').sort((a,b)=>a.date.localeCompare(b.date)).map(c=>'<div class="card camp"><div class="cv-row"><span class="pill teal">'+esc(c.theme)+'</span>'+(REG.has(c.id)?'<span class="pill good">'+icon('check')+'You are going</span>':'')+'</div><h3>'+esc(c.title)+'</h3><p class="muted small">'+wd(c.date)+' '+fmtDate(c.date)+' · '+esc(c.where)+'</p><p>'+esc(c.desc)+'</p>'
  +(c.seats?'<div class="bar"><i style="width:'+pct(c.booked,c.seats)+'%"></i></div><span class="muted small num">'+c.booked+' of '+c.seats+' places taken</span>':'<span class="muted small num">'+c.booked+' colleagues joined</span>')
  +'<div>'+regBtn(c)+'</div></div>').join('')+'</section>';

/* CLINICS */
S.clinics=()=>head('Find a provider','Partner hospitals and clinics. Show your card, pay nothing.')+'<section class="sect">'
 +D.CLINICS.map(c=>'<div class="card clin"><div class="kc-h"><span class="oi">'+icon('clinic')+'</span><span><b>'+esc(c.name)+'</b><span class="muted small">'+esc(c.area)+'</span></span>'+(c.soon?'<span class="pill info">Opening Dec</span>':'<span class="pill good">Pay nothing</span>')+'</div>'
  +'<span class="small">'+icon('calendar')+esc(c.hours)+(c.phone!=='—'?' · '+esc(c.phone):'')+'</span><div class="chips sm">'+c.services.map(s=>'<span class="chip ro">'+esc(s)+'</span>').join('')+'</div>'
  +(c.soon?'':'<button class="btn sm" data-act="bkStart" data-clinic="'+c.id+'">Book here</button>')+'</div>').join('')
 +'<p class="muted small">Other hospitals: pay, keep the receipt and claim a refund within 30 days.</p></section>';

/* INBOX */
const OLD=D.messages.filter(m=>m.toIds==='all').map(m=>({id:'o-'+m.id,date:m.date,channels:m.channels,subject:m.subject,body:m.body,read:true,from:'PSI HR'}));
let msgSel=null;
const allMsgs=()=>D.inbox.concat(OLD);
const chips=ch=>(ch||[]).map(c=>'<span class="chn">'+(c==='sms'?'SMS':c==='email'?'Email':c==='app'?'App':esc(c))+'</span>').join('');
ACT.msgOpen=el=>{const m=allMsgs().find(x=>String(x.id)===el.dataset.id);if(!m)return;m.read=true;msgSel=m.id;EMP.go('msg')};
S.inbox=()=>{
 const L=allMsgs(),un=D.inbox.filter(m=>!m.read).length;
 return head('Inbox',un?un+' new from PSI HR':'Messages from PSI HR and Nuru',false)+'<section class="sect"><div class="list">'
 +L.map(m=>'<button class="row msg'+(m.read?'':' unread')+'" data-act="msgOpen" data-id="'+esc(m.id)+'"><span class="ri">'+icon(m.read?'msg':'bell')+'</span><span class="rt"><b>'+esc(m.subject||m.title||'Message from PSI HR')+'</b><span class="muted small clamp">'+esc(m.body||m.text||'')+'</span><span class="chns">'+chips(m.channels)+'</span></span><span class="rr"><span class="muted small">'+fmtDate(m.date||TODAY).replace(' 2026','')+'</span>'+(m.read?'':'<i class="udot" aria-label="Unread"></i>')+'</span></button>').join('')
 +'</div>'+(D.inbox.length?'':'<p class="muted small tipline">'+icon('send')+'Send a message from the HR portal and it lands here in Inbox.</p>')+'</section>';
};
S.msg=()=>{
 const m=allMsgs().find(x=>x.id===msgSel);
 if(!m)return head('Message')+'<p class="empty">This message is no longer here.</p>';
 return head('Message')+'<section class="sect"><div class="card msgfull"><div class="chns">'+chips(m.channels)+'</div><h2>'+esc(m.subject||m.title||'Message from PSI HR')+'</h2><p class="muted small">From '+esc(m.from||'PSI HR')+' · '+fmtDate(m.date||TODAY)+'</p><div class="mbody">'+esc(m.body||m.text||'').replace(/\n/g,'<br>')+'</div></div>'
 +(/screening/i.test((m.subject||'')+(m.body||''))?campBanner(D.campaigns.find(c=>c.id==='c1')):'')+'</section>';
};
